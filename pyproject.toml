[project]
name = "inkflow-core"
version = "0.0.0"
description = "Reference research pipeline for procedural handwriting extraction"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
vision = ["scipy", "opencv-python-headless", "scikit-image"]
font = ["fonttools", "ufo2ft"]
test = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/inkflow-core/src"]
